<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <script>
    // Os servidores de vídeo do provedor só entregam via HTTP.
    // Em páginas HTTPS o navegador bloqueia o vídeo, então redireciona para a versão HTTP.
    if (location.hostname.indexOf('vercel.app') !== -1) {
      location.replace('http://canalplus-tv.surge.sh/');
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canal+ | Web & Smart TV Player</title>
  <link rel="stylesheet" href="css/style.css?v=4">
  <!-- HLS.js for Live & VOD Video Playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

  <!-- ==========================================
       1. TELA DE LOGIN
  =========================================== -->
  <div id="login-screen">
    <div class="login-card">
      <div class="brand-badge">
        <span class="logo-icon">📺</span>
        <h1>CANAL<span>+</span></h1>
      </div>

      <div class="form-group">
        <label for="login-user">Usuário</label>
        <input type="text" id="login-user" class="form-input focusable" placeholder="Seu usuário" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="login-pass">Senha</label>
        <input type="password" id="login-pass" class="form-input focusable" placeholder="Sua senha" autocomplete="off">
      </div>

      <button id="btn-login" class="btn-primary focusable">
        <span>ENTRAR NO CANAL+</span> ▶
      </button>

      <div id="login-msg" class="login-msg"></div>

      <!-- BOTÃO WHATSAPP CHAMATIVO -->
      <div class="btn-whatsapp-box">
        <a href="https://wa.me/5544988223365?text=Ol%C3%A1%2C%20quero%20ter%20acesso%20ao%20login%20e%20senha" target="_blank" class="btn-whatsapp focusable">
          <span style="font-size: 18px;">💬</span>
          <span>Para ter acesso ao login e senha clique aqui</span>
        </a>
      </div>
    </div>
  </div>

  <!-- ==========================================
       2. APLICATIVO PRINCIPAL
  =========================================== -->
  <div id="app-screen" style="display: none;">
    
    <!-- Barra Superior -->
    <header class="top-navbar">
      <div class="nav-left">
        <div class="app-logo">CANAL<span>+</span></div>
        <nav class="nav-tabs">
          <button class="nav-tab-btn focusable active" data-section="live">
            <span>📺</span> Ao Vivo
          </button>
          <button class="nav-tab-btn focusable" data-section="movies">
            <span>🎬</span> Filmes
          </button>
          <button class="nav-tab-btn focusable" data-section="series">
            <span>🍿</span> Séries
          </button>
          <button class="nav-tab-btn tab-games focusable" data-section="games">
            <span>🎮</span> Jogos Retrô
          </button>
        </nav>
      </div>

      <div class="nav-right">
        <div class="user-badge">
          <span id="user-name" class="user-name">Usuário</span>
          <span id="user-status" class="user-status">Ativo</span>
        </div>
        <button id="btn-logout" class="btn-icon focusable" title="Sair da Conta">
          🚪
        </button>
      </div>
    </header>

    <!-- Corpo do App -->
    <main class="app-body">
      
      <!-- Barra Lateral de Categorias -->
      <aside class="categories-sidebar">
        <div class="sidebar-header">
          <div class="search-box">
            <input type="text" id="search-input" class="search-input focusable" placeholder="🔍 Buscar canal, filme...">
          </div>
        </div>
        <div id="categories-list" class="categories-list">
          <!-- Categorias inseridas dinamicamente via JS -->
        </div>
      </aside>

      <!-- Grade Principal de Conteúdo -->
      <section class="content-viewport">
        <div class="content-header">
          <h2 id="content-title" class="content-title">📺 Canais Ao Vivo</h2>
          <span id="content-count" class="content-count">0 itens</span>
        </div>
        <div id="items-grid" class="items-grid live-mode">
          <!-- Cards de canais / filmes inseridos via JS -->
        </div>
      </section>

      <!-- Container do Arcade de Jogos Retrô -->
      <div id="arcade-container">
        <iframe id="arcade-iframe" src="" allowfullscreen></iframe>
      </div>

    </main>
  </div>

  <!-- ==========================================
       3. MODAL DE DETALHES (FILMES & SÉRIES)
  =========================================== -->
  <div id="detail-modal" class="modal-overlay">
    <div class="modal-content">
      <button id="modal-close-btn" class="modal-close-btn focusable">✕</button>
      
      <div class="modal-poster">
        <img id="modal-poster" src="" alt="Capa">
      </div>

      <div class="modal-details">
        <h2 id="modal-title" class="modal-title">Título</h2>
        
        <div class="modal-meta">
          <span id="modal-year" class="meta-badge">2026</span>
          <span id="modal-rating" class="meta-badge" style="color:#ffd700">★ 9.0</span>
          <span id="modal-duration" class="meta-badge">1h 45m</span>
          <span id="modal-genre" class="meta-badge">Ação</span>
        </div>

        <p id="modal-plot" class="modal-plot">Sinopse...</p>

        <div class="modal-actions">
          <button id="btn-watch" class="btn-watch focusable">
            <span>▶</span> Assistir
          </button>
          <button id="btn-fav" class="btn-fav focusable">
            Adicionar aos Favoritos
          </button>
        </div>

        <!-- Seletor de Temporadas e Episódios (Para Séries) -->
        <div id="episodes-container" class="episodes-container" style="display: none;">
          <div id="seasons-bar" class="seasons-bar"></div>
          <div id="episodes-list" class="episodes-list"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================
       4. REPRODUTOR DE VÍDEO
  =========================================== -->
  <div id="player-overlay">
    <video id="main-video" playsinline></video>

    <!-- Topbar do Player -->
    <div class="player-topbar">
      <div id="player-title" class="player-title">Reproduzindo</div>
      <div style="display: flex; gap: 10px; align-items: center;">
        <button id="player-fav-btn" class="btn-icon focusable" style="background: rgba(0,0,0,0.6); display: none; font-size: 13px; font-weight: 700; padding: 8px 16px; border-radius: 8px;">
          ☆ Favorito
        </button>
        <button id="player-back-btn" class="btn-icon focusable" style="background: rgba(0,0,0,0.6);">
          ✕ Fechar
        </button>
      </div>
    </div>

    <!-- Controles do Player -->
    <div class="player-controls">
      <!-- Barra de Qualidade e Aspecto (Canais Ao Vivo) -->
      <div id="player-quality-bar" class="player-quality-bar" style="display: none;">
        <div class="quality-bar-left">
          <span class="quality-bar-tag">QUALIDADE:</span>
          <div id="quality-pills-row" class="quality-pills-row"></div>
        </div>
        <div class="quality-bar-divider"></div>
        <div class="quality-bar-right">
          <button id="btn-aspect-contain" class="aspect-pill active focusable" title="Proporção Original">
            ⛶ Original
          </button>
          <button id="btn-aspect-fill" class="aspect-pill focusable" title="Ajustar à Tela">
            ⛶ Ajustar
          </button>
        </div>
      </div>

      <div id="player-timeline-box" class="player-timeline-box">
        <span id="player-time-current">00:00</span>
        <input type="range" id="player-timeline" class="timeline-slider focusable" min="0" max="100" value="0">
        <span id="player-time-total">00:00</span>
      </div>

      <div class="player-btns-row">
        <button id="player-play-pause" class="player-btn play-btn focusable">
          ⏸
        </button>
      </div>
    </div>
  </div>

  <!-- ==========================================
       5. MODAL DE CONTROLE PARENTAL (PIN)
  =========================================== -->
  <div id="pin-modal">
    <div class="pin-card">
      <div class="pin-lock">🔒</div>
      <h3 id="pin-title">Conteúdo protegido</h3>
      <p id="pin-subtitle">Digite a senha de 4 dígitos</p>

      <div class="pin-display">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>
      <div id="pin-error"></div>

      <div class="pin-keyboard">
        <button class="pin-key focusable" data-val="1">1</button>
        <button class="pin-key focusable" data-val="2">2</button>
        <button class="pin-key focusable" data-val="3">3</button>
        <button class="pin-key focusable" data-val="4">4</button>
        <button class="pin-key focusable" data-val="5">5</button>
        <button class="pin-key focusable" data-val="6">6</button>
        <button class="pin-key focusable" data-val="7">7</button>
        <button class="pin-key focusable" data-val="8">8</button>
        <button class="pin-key focusable" data-val="9">9</button>
        <button class="pin-key pin-key-muted focusable" data-val="close">✕</button>
        <button class="pin-key focusable" data-val="0">0</button>
        <button class="pin-key pin-key-muted focusable" data-val="back">⌫</button>
      </div>

      <button id="pin-change-btn" class="pin-link focusable">Alterar senha</button>
    </div>
  </div>
  <style>
    #pin-modal { display:none; position:fixed; inset:0; z-index:9999; align-items:center; justify-content:center;
      background:rgba(0,0,0,.75); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); font-family:inherit; }
    #pin-modal .pin-card { width:320px; max-width:92vw; padding:28px 26px 18px; text-align:center; color:#fff;
      background:linear-gradient(180deg,#1b2233,#121722); border:1px solid rgba(255,255,255,.08);
      border-radius:22px; box-shadow:0 24px 60px rgba(0,0,0,.6); animation:pinIn .18s ease-out; }
    #pin-modal .pin-lock { width:56px; height:56px; margin:0 auto 12px; border-radius:50%; display:flex;
      align-items:center; justify-content:center; font-size:26px; background:rgba(0,200,255,.12); }
    #pin-modal h3 { margin:0 0 4px; font-size:19px; font-weight:600; }
    #pin-modal #pin-subtitle { margin:0; font-size:13px; color:#9aa4b5; min-height:18px; }
    #pin-modal .pin-display { display:flex; justify-content:center; gap:16px; margin:22px 0 6px; }
    #pin-modal .pin-dot { width:14px; height:14px; border-radius:50%; border:2px solid #4a5568;
      background:transparent; transition:all .15s; }
    #pin-modal .pin-dot.filled { background:#00c8ff; border-color:#00c8ff; box-shadow:0 0 10px rgba(0,200,255,.6); }
    #pin-modal.pin-ok .pin-dot { background:#2ecc71; border-color:#2ecc71; box-shadow:none; }
    #pin-modal #pin-error { height:18px; font-size:12px; color:#ff6b6b; margin-bottom:10px; }
    #pin-modal .pin-display.shake { animation:pinShake .35s; }
    #pin-modal .pin-display.shake .pin-dot { border-color:#ff6b6b; background:#ff6b6b; box-shadow:none; }
    #pin-modal .pin-keyboard { display:grid; grid-template-columns:repeat(3,64px); gap:12px 18px; justify-content:center; }
    #pin-modal .pin-key { width:64px; height:64px; border-radius:50%; border:none; cursor:pointer; font-size:24px;
      font-weight:500; color:#fff; background:rgba(255,255,255,.06); transition:background .12s, transform .08s; outline:none; }
    #pin-modal .pin-key:hover, #pin-modal .pin-key:focus { background:rgba(0,200,255,.25); }
    #pin-modal .pin-key:focus { box-shadow:0 0 0 3px #00c8ff; }
    #pin-modal .pin-key:active { transform:scale(.92); }
    #pin-modal .pin-key-muted { background:transparent; color:#9aa4b5; font-size:20px; }
    #pin-modal .pin-link { margin-top:16px; background:none; border:none; color:#00c8ff; font-size:13px;
      cursor:pointer; padding:8px 12px; border-radius:8px; outline:none; }
    #pin-modal .pin-link:hover, #pin-modal .pin-link:focus { background:rgba(0,200,255,.12); }
    @keyframes pinShake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
    @keyframes pinIn { from{opacity:0; transform:scale(.95)} to{opacity:1; transform:scale(1)} }
  </style>

  <!-- ==========================================
       6. NOTIFICAÇÃO TOAST
  =========================================== -->
  <div id="toast" class="toast">Mensagem</div>

  <!-- Scripts -->
  <script src="js/favorites.js?v=7"></script>
  <script src="js/parental.js?v=8"></script>
  <script src="js/api.js?v=7"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
